<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="../css/output.css">
</head>
<body class="bg-gray-50 text-coffee-dark font-sans antialiased overflow-hidden">

  <div class="flex h-screen w-full">
    
    <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 bg-coffee-dark text-white transform translate-x-full lg:translate-x-0 
    lg:static transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">

        <a href="../index.html" class="flex items-center gap-2 text-xl font-bold">

          Bean & Brew

        <button id="close-sidebar" class="lg:hidden text-white/50 hover:text-white">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/5 hover:text-white rounded-xl transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" /></svg>
          داشبورد
        </a>
        <a href="products.html" class="flex items-center gap-3 px-4 py-3 bg-coffee-caramel text-white rounded-xl transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" /></svg>
          مدیریت محصولات
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/5 hover:text-white rounded-xl transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" /></svg>
          مدیریت سفارشات
        </a>
      </nav>
      <div class="p-4 border-t border-white/10">
        <a href="../index.html" class="flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-500/10 rounded-xl transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" /></svg>
          خروج از حساب
        </a>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-gray-50">
      
      <header class="bg-white h-20 px-6 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center gap-4">
          <button id="open-sidebar" class="lg:hidden p-2 text-coffee-dark hover:text-coffee-caramel">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>
          <h2 class="text-xl font-bold text-coffee-dark hidden sm:block">مدیریت محصولات</h2>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-sm font-bold bg-coffee-cream px-4 py-2 rounded-xl">سلام، مدیر 👋</span>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-4 md:p-6">
        
        <div class="flex justify-between items-center mb-6">
          <p class="text-gray-500 text-sm">در این بخش می‌توانید محصولات را مدیریت کنید.</p>
          <button id="open-modal-btn" class="btn-primary !px-4 !py-2 text-sm flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
            افزودن محصول جدید
          </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-right min-w-[800px]">
              <thead class="bg-gray-50 text-gray-500 text-sm">
                <tr>
                  <th class="py-3 px-6 font-medium">محصول</th>
                  <th class="py-3 px-6 font-medium">دسته‌بندی</th>
                  <th class="py-3 px-6 font-medium">قیمت تک</th>
                  <th class="py-3 px-6 font-medium">موجودی</th>
                  <th class="py-3 px-6 font-medium">وضعیت</th>
                  <th class="py-3 px-6 font-medium">عملیات</th>
                </tr>
              </thead>
              <tbody class="divide-gray-100">
                <tr class="hover:bg-gray-50 transition-colors">
                  <td class="py-4 px-6">
                    <div class="flex items-center gap-3">
                      <img src="../assets/images/images (9).jpg" alt="قهوه" class="w-10 h-10 rounded-lg object-cover">
                      <span class="font-bold text-sm">قهوه گریفون پاوا</span>
                    </div>
                  </td>
                  <td class="py-4 px-6 text-sm text-gray-600">قهوه</td>
                  <td class="py-4 px-6 text-sm font-bold">۲۸۰,۰۰۰</td>
                  <td class="py-4 px-6 text-sm">۵۰ عدد</td>
                  <td class="py-4 px-6"><span class="bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full">موجود</span></td>
                  <td class="py-4 px-6">
                    <div class="flex items-center gap-2">
                      <button class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" /></svg></button>
                      <button class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg></button>
                    </div>
                  </td>
                </tr>
                <tr class="hover:bg-gray-50 transition-colors">
                  <td class="py-4 px-6">
                    <div class="flex items-center gap-3">
                      <img src="../assets/images/IMG_2875-300x300.jpg" alt="تمپر" class="w-10 h-10 rounded-lg object-cover">
                      <span class="font-bold text-sm">تمپر چوبی</span>
                    </div>
                  </td>
                  <td class="py-4 px-6 text-sm text-gray-600">ابزارآلات</td>
                  <td class="py-4 px-6 text-sm font-bold">۶۵۰,۰۰۰</td>
                  <td class="py-4 px-6 text-sm text-amber-600 font-bold">۳ عدد</td>
                  <td class="py-4 px-6"><span class="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full">کم موجود</span></td>
                  <td class="py-4 px-6">
                    <div class="flex items-center gap-2">
                      <button class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" /></svg></button>
                      <button class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg></button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div id="product-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden animate-fade-in-up">
          
          <div class="flex items-center justify-between p-6 border-b border-gray-100">
            <h3 class="text-lg font-bold text-coffee-dark">افزودن محصول جدید</h3>
            <button id="close-modal-btn" class="text-gray-400 hover:text-red-500 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
          </div>

          <div class="p-6 space-y-4">
            <div>
              <label class="block text-sm font-bold mb-2">نام محصول</label>
              <input type="text" class="form-input" placeholder="مثلاً: قهوه کلمبیا">
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold mb-2">قیمت (تومان)</label>
                <input type="number" class="form-input" placeholder="۲۵۰۰۰۰">
              </div>
              <div>
                <label class="block text-sm font-bold mb-2">موجودی</label>
                <input type="number" class="form-input" placeholder="۵۰">
              </div>
            </div>
            <div>
              <label class="block text-sm font-bold mb-2">دسته‌بندی</label>
              <select class="form-input">
                <option>قهوه</option>
                <option>نسکافه</option>
                <option>ابزارآلات</option>
                <option>دسر</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-bold mb-2">عکس محصول</label>
              <input type="file" class="form-input file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-coffee-cream file:text-coffee-dark hover:file:bg-coffee-caramel/20 cursor-pointer">
            </div>
          </div>

          <div class="p-6 border-t border-gray-100 flex gap-3">
            <button id="cancel-modal-btn" class="flex-1 px-4 py-3 rounded-xl border-2 border-gray-200 font-bold text-gray-500 hover:bg-gray-50 transition-colors">انصراف</button>
            <button class="flex-1 btn-primary !rounded-xl">ذخیره محصول</button>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
