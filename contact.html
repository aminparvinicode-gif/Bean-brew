<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تماس با ما | Bean & Brew</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="./css/output.css">
</head>
<body class="bg-coffee-cream text-coffee-dark font-sans antialiased overflow-x-hidden flex flex-col min-h-screen dark:bg-gray-900 dark:text-coffee-cream transition-colors duration-300">

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
    
    <div class="text-center mb-12">
      <h1 class="text-3xl md:text-4xl font-bold mb-4">با ما در ارتباط باشید</h1>
      <p class="text-coffee-dark/60 dark:text-coffee-cream/60">سوالی دارید یا می‌خواهید سفارش عمده ثبت کنید؟ ما همیشه خوشحال می‌شویم بشنویم.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
      
      <div class="space-y-8">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-coffee-cream dark:border-gray-700 flex items-start gap-4">
          <div class="w-12 h-12 bg-coffee-caramel/10 text-coffee-caramel rounded-full flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" /></svg>
          </div>
          <div>
            <h3 class="font-bold text-lg mb-1">آدرس کافه</h3>
            <p class="text-sm text-coffee-dark/60 dark:text-coffee-cream/60">تهران، خیابان ولیعصر، پلاک ۱۲۳، طبقه همکف</p>
          </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-coffee-cream dark:border-gray-700 flex items-start gap-4">
          <div class="w-12 h-12 bg-coffee-caramel/10 text-coffee-caramel rounded-full flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" /></svg>
          </div>
          <div>
            <h3 class="font-bold text-lg mb-1">شماره تماس</h3>
            <p class="text-sm text-coffee-dark/60 dark:text-coffee-cream/60" dir="ltr">۰۲۱-۱۲۳۴۵۶۷۸</p>
            <p class="text-sm text-coffee-dark/60 dark:text-coffee-cream/60" dir="ltr">۰۹۱۲-۳۴۵۶۷۸۹ (واتساپ)</p>
          </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-coffee-cream dark:border-gray-700 flex items-start gap-4">
          <div class="w-12 h-12 bg-coffee-caramel/10 text-coffee-caramel rounded-full flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" /></svg>
          </div>
          <div>
            <h3 class="font-bold text-lg mb-1">ایمیل</h3>
            <p class="text-sm text-coffee-dark/60 dark:text-coffee-cream/60" dir="ltr">info@beanandbrew.ir</p>
          </div>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 md:p-8 shadow-md border border-coffee-cream dark:border-gray-700">
        <h2 class="text-xl font-bold mb-6">ارسال پیام</h2>
        <form class="space-y-4">
          <div>
            <label class="block text-sm font-bold mb-2">نام و نام خانوادگی</label>
            <input type="text" placeholder="نام شما" class="form-input dark:bg-gray-700 dark:border-gray-600 dark:text-white">
          </div>
          <div>
            <label class="block text-sm font-bold mb-2">ایمیل</label>
            <input type="email" placeholder="example@email.com" class="form-input text-left" dir="ltr">
          </div>
          <div>
            <label class="block text-sm font-bold mb-2">موضوع</label>
            <input type="text" placeholder="موضوع پیام" class="form-input">
          </div>
          <div>
            <label class="block text-sm font-bold mb-2">متن پیام</label>
            <textarea rows="4" placeholder="پیام خود را بنویسید..." class="form-input resize-none"></textarea>
          </div>
          <button type="submit" class="btn-primary w-full py-4 mt-2">ارسال پیام</button>
        </form>
      </div>
    </div>

    <div class="mt-12 bg-white dark:bg-gray-800 rounded-3xl overflow-hidden shadow-lg border border-coffee-cream dark:border-gray-700 h-80">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12958.865998715474!2d51.389!3d35.6892!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzXCsDQxJzIxLjEiTiA1McKwMjMnMjAuNCJF!5e0!3m2!1sen!2s!4v1600000000000" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>

  </main>
  <script src="./js/main.js"></script>
</body>
</html>
