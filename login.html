<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به پنل مدیریت | Bean & Brew</title>
    <link rel="stylesheet" href="./css/output.css" />
  </head>

  <body
    class="bg-coffee-cream text-coffee-dark font-sans antialiased min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="bg-white rounded-3xl p-8 md:p-10 w-full max-w-md shadow-2xl border border-coffee-cream animate-fade-in-up"
    >
      <div class="text-center mb-8">
        <div
          class="w-16 h-16 bg-coffee-caramel text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"
            />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-coffee-dark">پنل مدیریت</h1>
        <p class="text-coffee-caramel text-sm mt-2">
          لطفاً اطلاعات خود را وارد کنید
        </p>
      </div>

      <div
        id="login-error"
        class="hidden bg-red-50 text-red-600 text-sm font-bold p-3 rounded-xl mb-4 text-center border border-red-200"
      >
        نام کاربری یا رمز عبور اشتباه است!
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-coffee-dark mb-2"
            >نام کاربری</label
          >
          <input
            type="text"
            id="username"
            required
            placeholder="admin"
            class="form-input text-left"
            dir="ltr"
          />
        </div>
        <div>
          <label class="block text-sm font-bold text-coffee-dark mb-2"
            >رمز عبور</label
          >
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
            class="form-input text-left"
            dir="ltr"
          />
        </div>

        <button type="submit" class="btn-primary w-full py-4 mt-2">
          ورود به پنل
        </button>
      </form>

      <div
        class="mt-8 text-center bg-coffee-cream/50 p-3 rounded-xl border border-coffee-cream"
      >
        <p class="text-xs text-coffee-dark/60">برای تست (دمو):</p>
        <p class="text-sm font-bold text-coffee-dark mt-1">
          نام کاربری: <span class="text-coffee-caramel">admin</span> | رمز:
          <span class="text-coffee-caramel">1234</span>
        </p>
      </div>
    </div>
    <script src="./js/auth.js"></script>
  </body>
</html>
